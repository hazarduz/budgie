services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: budgie
      POSTGRES_PASSWORD: budgie
      POSTGRES_DB: budgie
    ports:
      - "5343:5432"
    volumes:
      - budgie-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U budgie"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://budgie:budgie@db:5432/budgie?schema=public"
      SESSION_SECRET: "${SESSION_SECRET:?Set SESSION_SECRET in your .env file (generate one with openssl rand -base64 32)}"
    ports:
      - "3010:3000"

volumes:
  budgie-db:
